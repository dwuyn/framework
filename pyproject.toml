[project]
name = "pentest-agent"
version = "0.3.0-dev"
description = "VeriPlanPT — Evidence-Gated Difficulty- and Budget-Aware Planning for Autonomous Network Penetration Testing"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    # ── Orchestration ────────────────────────────────────────────────────────
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.0.0",
    # ── LangChain core (used by graph nodes and agents) ──────────────────────
    "langchain-core>=0.3.75,<0.4",
    "langchain-community>=0.3.27,<0.4",
    "langchain-google-vertexai>=2.0.0",
    # ── Google GenAI SDK (Vertex AI, Gemini, Gemma) ──────────────────────────
    "google-genai>=1.0",
    # ── HTTP / data ──────────────────────────────────────────────────────────
    "httpx>=0.27",
    "pyyaml>=6.0",
    "packaging>=24.0",
    "gitpython>=3.1",
    # ── Misc runtime utils ───────────────────────────────────────────────────
    "tqdm>=4.67",
    "msgpack>=1.1,<2",
    "certifi (>=2026.1.4)",
    "urllib3 (>=2.6.3,<3)",
    "cryptography (>=49,<50)",
]

[project.optional-dependencies]
benchmark = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Prevent pytest from descending into dataset lab payloads or vendored PoC code.
norecursedirs = ["data_test", "data", "agents"]
addopts = "--tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["data_test", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.0)",
    "pytest-cov (>=5.0)",
    "ruff (>=0.5)",
    "mypy (>=1.10)"
]
